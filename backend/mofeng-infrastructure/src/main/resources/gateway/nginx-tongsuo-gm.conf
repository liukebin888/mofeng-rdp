# ============================================================
# MOFENG-RDP 国密 TLS 网关配置模板（SEC-012 / B5）
# 对应 docs/DEPLOYMENT.md 五·一节，落地选项 1：Nginx + tongsuo（铜锁）
#
# 职责：在平台边界终止国密 TLS（SM2 双证书 / SM3 签名 / SM4 加密），
#       向内以受控内网明文/标准 TLS 转发到后端 127.0.0.1:8787。
#       应用层（后端）完全不动——国密属网关层职责，非应用代码层。
#
# 判据（由领域层 GmTlsEngine 复核）：
#   - 密钥协商 SM2（签名 + 加密双证书），无 RSA/AES 回落
#   - 签名/摘要 SM3，证书链与算法符合国密
#   - 传输加密 SM4，协议扫描无弱套件（TLS1.2 以下 0 个）
#   - 密钥分级 + 轮换，密钥不入库（NFR-010 物理分离）
# ============================================================

# --- 顶层：仅监听 443，禁用 80 明文回退（避免明文旁路） ---
# server { listen 80; return 301 https://$host$request_uri; }  # 可选：仅跳转，不回退明文服务

server {
    # 国密监听（tongsuo 需启用 GM 套件的专用指令）
    listen 443 ssl;

    server_name gm.mofeng-rdp.local;

    # ---- 国密 TLS 套件：仅 SM2/SM3/SM4，禁止 RSA/AES 回落 ----
    # tongsuo 编译时启用 --enable-ntls；ssl_ciphers 仅列国密套件
    ssl_protocols TLSv1.3 TLSv1.2;          # 禁止 TLS1.2 以下（判据：TLS1.2 以下 0 个）
    ssl_ciphers "ECC-SM2-SM4-CBC-SM3:ECC-SM2-SM4-GCM-SM3:ECDHE-SM2-SM4-CBC-SM3";
    ssl_prefer_server_ciphers on;

    # ---- SM2 双证书：签名证书 + 加密证书（密钥与数据物理分离，不落应用库） ----
    # 注意：证书与私钥文件路径由密钥管理系统注入，不随代码入库（.pem/.key 已 .gitignore）
    ssl_certificate     /etc/gm/keys/sign_cert.pem;      # SM2 签名证书
    ssl_certificate_key /etc/gm/keys/sign_key.pem;       # SM2 签名私钥（分级托管）
    ssl_certificate     /etc/gm/keys/encrypt_cert.pem;   # SM2 加密证书（双证书）
    ssl_certificate_key /etc/gm/keys/encrypt_key.pem;    # SM2 加密私钥（分级托管）

    # ---- SM3 签名摘要（tongsuo 默认对国密套件使用 SM3） ----
    # ssl_verify 相关：如需双向认证可启用 ssl_verify_client，此处按单向网关卸载默认关闭

    # ---- 密钥轮换（分级 + 轮换，NFR-010） ----
    # 实际轮换由密钥管理系统调度，nginx 仅 reload 生效；此处注释说明周期约定：
    #   根密钥/CA 级：每年轮换；业务证书级：≤90 天轮换；会话密钥：每连接临时派生（SM2 协商）

    # ---- 内网受控转发（卸载后再加密：内网可标准 TLS 或受控明文，视等保定级） ----
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 租户上下文透传（应用层按 x-tenant-id 隔离，伪造租户 403）
        proxy_set_header x-tenant-id $http_x_tenant_id;
    }
}

# ============================================================
# 合规自证脚本约定（协议扫描 + 证书链复核）
#   nginx -T 导出运行配置后，用领域层 GmTlsEngine 复核：
#     - scan(enabledSuites)  → 无弱套件、无 RSA/AES 回落、TLS1.2 以下 0 个
#     - verifyCertChain(...) → 证书链每级算法 SM2，双证书齐备
#     - checkKeyManagement  → 密钥分级≥2 级、轮换周期 1~365 天、与数据物理分离
# ============================================================
